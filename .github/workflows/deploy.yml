name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false # 서브모듈을 가져오지 않도록 명시적으로 설정

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Print MapComponent.js content for debugging
        run: |
          echo "--- Content of client/src/components/MapComponent.js ---"
          cat client/src/components/MapComponent.js
          echo "----------------------------------------------------"

      - name: Install dependencies and build
        run: |
          cd client
          npm cache clean --force
          npm install --force
          npm run build
        env:
          REACT_APP_GOOGLE_MAPS_API_KEY: ${{ secrets.REACT_APP_GOOGLE_MAPS_API_KEY }}
          CI: false

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd client
          npx gh-pages -d build --repo "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"