name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false # 서브모듈을 가져오지 않도록 명시적으로 설정

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # 프로젝트에 맞는 Node.js 버전으로 설정

      - name: Print MapComponent.js content for debugging
        run: |
          echo "--- Content of client/src/components/MapComponent.js ---"
          cat client/src/components/MapComponent.js
          echo "----------------------------------------------------"

      - name: Install dependencies and build
        run: |
          cd client
          # Clean build artifacts and npm cache to ensure fresh build
          rm -rf build
          npm cache clean --force
          npm install
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4