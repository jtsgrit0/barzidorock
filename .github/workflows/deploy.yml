name: Deploy to GitHub Pages
# ⛔ 이 워크플로우는 비활성화되어 있습니다.
# 이 프로젝트는 Vercel(https://barzidorock.vercel.app)에 배포됩니다.
# Vercel은 main 브랜치 push 시 자동으로 배포됩니다.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: '이 워크플로우는 현재 사용하지 않습니다. Vercel로 자동 배포됩니다.'
        required: false

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: 배포 안내
        run: |
          echo "이 프로젝트는 Vercel을 통해 자동 배포됩니다."
          echo "배포 URL: https://barzidorock.vercel.app"
          echo "Vercel 대시보드: https://vercel.com/dashboard"